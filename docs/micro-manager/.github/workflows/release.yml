name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and package version
        run: |
          package_version="$(node --print "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          }

      - name: Verify package
        run: pnpm verify

      - name: Create package tarball
        id: pack
        run: |
          mkdir release
          npm pack --pack-destination release
          tarball="$(find release -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "${tarball}"
          echo "tarball=$(basename "${tarball}")" >> "${GITHUB_OUTPUT}"

      - name: Preserve package tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARBALL: release/${{ needs.build.outputs.tarball }}
        run: |
          generated="$(mktemp)"
          notes="$(mktemp)"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --field "tag_name=${GITHUB_REF_NAME}" \
            --field "target_commitish=${GITHUB_SHA}" > "${generated}"
          jq --raw-output '.body' "${generated}" > "${notes}"
          title="$(jq --raw-output --arg tag "${GITHUB_REF_NAME}" '.name // $tag' "${generated}")"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${title}" \
              --notes-file "${notes}" \
              --verify-tag
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${title}" \
              --notes-file "${notes}" \
              --verify-tag
          fi

          gh release upload "${GITHUB_REF_NAME}" "${TARBALL}" --clobber
